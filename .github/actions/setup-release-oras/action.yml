name: Set up release ORAS
description: Install the checksum-pinned Linux AMD64 publisher on Ubuntu CI runners
runs:
  using: composite
  steps:
    # The action has a bundled release catalog that predates ORAS 1.3.2.
    # Explicit URL + checksum bypass that catalog without weakening pinning.
    - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      with:
        url: https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_amd64.tar.gz
        checksum: 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf
