# Repository-owned: native binary builds and manifest publication share one
# validated source version. This workflow is outside generate-ci-gha ownership.
name: Build & push Docker images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:


concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  release-version:
    name: Validate source release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      publish_dockerhub: ${{ steps.credentials.outputs.available }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Read and validate versions.yaml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-versions.py --check
          version="$(python3 scripts/update-versions.py --print-version coldsnap)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag does not match versions.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - name: Check optional Docker Hub publication credentials
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub publication skipped: configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. GitHub binary releases are independent."
          fi

  test-coldsnap:
    name: Test coldsnap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache-dependency-path: ./go.sum

      - name: go vet
        run: go vet ./...
        working-directory: .

      - name: go test
        run: go test -count=1 ./...
        working-directory: .

  test-coldsnap-criu-rpc:
    name: Test coldsnap-criu-rpc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache-dependency-path: cmd/coldsnap-criu-rpc/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: cmd/coldsnap-criu-rpc

      - name: go test
        run: go test -count=1 ./...
        working-directory: cmd/coldsnap-criu-rpc
  build-coldsnap-binaries-linux-amd64:
    name: Build coldsnap-binaries (linux/amd64)
    runs-on: ubuntu-latest
    needs: [ release-version, test-coldsnap, test-coldsnap-criu-rpc ]
    if: needs.release-version.outputs.publish_dockerhub == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            scitrera/coldsnap-binaries
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.release-version.outputs.version }},enable=${{ needs.release-version.outputs.version != '' }}
            type=raw,value=${{ needs.release-version.outputs.major_minor }},enable=${{ needs.release-version.outputs.major_minor != '' }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/binaries/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=scitrera/coldsnap-binaries,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ needs.release-version.outputs.version }}
          cache-from: type=gha,scope=coldsnap-binaries-linux-amd64
          cache-to: type=gha,mode=max,scope=coldsnap-binaries-linux-amd64
  build-coldsnap-binaries-linux-arm64:
    name: Build coldsnap-binaries (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: [ release-version, test-coldsnap, test-coldsnap-criu-rpc ]
    if: needs.release-version.outputs.publish_dockerhub == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            scitrera/coldsnap-binaries
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.release-version.outputs.version }},enable=${{ needs.release-version.outputs.version != '' }}
            type=raw,value=${{ needs.release-version.outputs.major_minor }},enable=${{ needs.release-version.outputs.major_minor != '' }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/binaries/Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=scitrera/coldsnap-binaries,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ needs.release-version.outputs.version }}
          cache-from: type=gha,scope=coldsnap-binaries-linux-arm64
          cache-to: type=gha,mode=max,scope=coldsnap-binaries-linux-arm64
  merge-coldsnap-binaries:
    name: Merge coldsnap-binaries multi-arch manifest
    runs-on: ubuntu-latest
    needs: [ release-version, build-coldsnap-binaries-linux-amd64, build-coldsnap-binaries-linux-arm64 ]
    permissions:
      contents: read
      packages: write
    outputs:
      base-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            scitrera/coldsnap-binaries
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.release-version.outputs.version }},enable=${{ needs.release-version.outputs.version != '' }}
            type=raw,value=${{ needs.release-version.outputs.major_minor }},enable=${{ needs.release-version.outputs.major_minor != '' }}

      - name: Create multi-arch manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          eval "docker buildx imagetools create $TAGS \
            scitrera/coldsnap-binaries@${{ needs.build-coldsnap-binaries-linux-amd64.outputs.digest }} \
            scitrera/coldsnap-binaries@${{ needs.build-coldsnap-binaries-linux-arm64.outputs.digest }}"
