# Repository-owned: build and verify the exact source release before tagging
# its multi-architecture bundle. Outside generate-ci-gha ownership.
name: Build & push Docker images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing source release tag to publish (for example v0.3.20)'
        required: true
        type: string

concurrency:
  group: coldsnap-binaries-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BINARY_IMAGE: scitrera/coldsnap-binaries

jobs:
  release-version:
    name: Validate source release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Require an explicit release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an existing vMAJOR.MINOR.PATCH source tag"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Read and validate the tagged versions.yaml
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/update-versions.py --check
          version="$(python3 scripts/update-versions.py --print-version coldsnap)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag does not match the tagged versions.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Test source release (${{ matrix.module }})
    needs: release-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'cmd/coldsnap-criu-rpc']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Vet and test
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test -count=1 ./...

  build:
    name: Build and verify bundle (linux/${{ matrix.arch }})
    needs: [release-version, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      # The verifier comes from this workflow revision, while every Docker
      # build input and embedded identity comes from the immutable release.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-version.outputs.commit }}
          path: release-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3

      - name: Docker login (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 14f6b5b4-89d1-444f-911b-98df94b7ac9d
        with:
          username: scitrera

      - name: Build and push untagged digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: release-source
          file: release-source/deploy/binaries/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.BINARY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            COMMIT=${{ needs.release-version.outputs.commit }}
            VERSION=${{ needs.release-version.outputs.version }}
          cache-from: type=gha,scope=coldsnap-binaries-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=coldsnap-binaries-linux-${{ matrix.arch }}

      - name: Verify published platform bundle
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-version.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$BINARY_IMAGE@$DIGEST"
          docker pull --platform "linux/$ARCH" "$image"
          container="$(docker create --platform "linux/$ARCH" "$image")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/licenses"
          docker cp "$container:/opt/coldsnap/bin/." "$RUNNER_TEMP/bundle/"
          docker cp "$container:/usr/share/licenses/coldsnap/." "$RUNNER_TEMP/licenses/"
          python3 scripts/verify-binary-bundle.py "$RUNNER_TEMP/bundle" \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --arch "$ARCH"
          cmp release-source/LICENSE "$RUNNER_TEMP/licenses/LICENSE"
          cmp release-source/THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/licenses/THIRD_PARTY_NOTICES.md"
          cmp release-source/third_party/licenses/go-criu/LICENSE "$RUNNER_TEMP/licenses/third-party/go-criu/LICENSE"
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH.txt"

      - name: Record verified digest
        uses: actions/upload-artifact@v7
        with:
          name: binary-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 7

  macos-build:
    needs: release-version
    uses: ./.github/workflows/test-macos.yml
    with:
      source_ref: ${{ needs.release-version.outputs.commit }}

  macos-push:
    name: Publish verified Darwin payload (${{ matrix.arch }})
    needs: [release-version, macos-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-binary-layout-${{ matrix.arch }}
          path: macos-layout
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: '1.3.2'
      - name: Docker login (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 14f6b5b4-89d1-444f-911b-98df94b7ac9d
        with:
          username: scitrera
      - name: Upload and read back the native-tested payload by digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          digest="$(python3 -c 'import json; print(json.load(open("macos-layout/index.json"))["manifests"][0]["digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          for blob in macos-layout/blobs/sha256/*; do
            oras blob push "$BINARY_IMAGE" "$blob"
          done
          oras manifest push "$BINARY_IMAGE@$digest" "macos-layout/blobs/sha256/${digest#sha256:}"
          oras copy --to-oci-layout "$BINARY_IMAGE@$digest" "$RUNNER_TEMP/downloaded:bundle"
          for blob in macos-layout/blobs/sha256/*; do
            cmp "$blob" "$RUNNER_TEMP/downloaded/blobs/sha256/${blob##*/}"
          done
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/darwin-$ARCH.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-digest-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified multi-arch release tag
    needs: [release-version, build, macos-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Docker login (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 14f6b5b4-89d1-444f-911b-98df94b7ac9d
        with:
          username: scitrera
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-digest-*
          merge-multiple: true
          path: digests

      - name: Create release manifest without replacing an existing tag
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$BINARY_IMAGE:$RELEASE_VERSION"
          if docker buildx imagetools inspect "$tag" > /dev/null 2> "$RUNNER_TEMP/inspect-error"; then
            echo "::error::$tag already exists; refusing to replace a released bundle"
            exit 1
          elif ! grep -Eq 'not found|manifest unknown' "$RUNNER_TEMP/inspect-error"; then
            cat "$RUNNER_TEMP/inspect-error" >&2
            exit 1
          fi
          amd64="$(< digests/amd64.txt)"
          arm64="$(< digests/arm64.txt)"
          darwin_amd64="$(< digests/darwin-amd64.txt)"
          darwin_arm64="$(< digests/darwin-arm64.txt)"
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$darwin_amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$darwin_arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$tag" \
            "$BINARY_IMAGE@$amd64" "$BINARY_IMAGE@$arm64" \
            "$BINARY_IMAGE@$darwin_amd64" "$BINARY_IMAGE@$darwin_arm64"
          docker buildx imagetools inspect "$tag"
          echo "Published $tag from validated Linux and macOS bundles for AMD64 and ARM64." >> "$GITHUB_STEP_SUMMARY"
