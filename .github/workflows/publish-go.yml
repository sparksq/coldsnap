  github-release:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: [ build-coldsnap, build-coldsnap-vllm-adapter, build-coldsnap-sglang-adapter, build-coldsnap-criu-rpc ]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      - name: Checksums
        run: |
          set -euo pipefail
          # Written outside dist/ first: `sha256sum ./* > dist/checksums.txt`
          # truncates the file before the glob expands, so it would list itself.
          (cd dist && sha256sum ./*) > checksums.txt
          mv checksums.txt dist/
          cat dist/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
