# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Publish (Go)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coldsnap:
    name: Test coldsnap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache-dependency-path: ./go.sum

      - name: go vet
        run: go vet ./...
        working-directory: .

      - name: go test
        run: go test -count=1 ./...
        working-directory: .

  test-coldsnap-criu-rpc:
    name: Test coldsnap-criu-rpc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache-dependency-path: cmd/coldsnap-criu-rpc/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: cmd/coldsnap-criu-rpc

      - name: go test
        run: go test -count=1 ./...
        working-directory: cmd/coldsnap-criu-rpc

  verify-tag:
    name: Verify tag matches coldsnap version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Verify versions are in sync
        run: uvx --from 'git+https://github.com/scitrera/repo-tools.git@b4aa219f66bfbc8c03e1c42644eb77ebb7983bd9' sync-versions --check --verbose

      - name: Compare tag against versions.yaml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(uvx --from 'git+https://github.com/scitrera/repo-tools.git@b4aa219f66bfbc8c03e1c42644eb77ebb7983bd9' sync-versions --print-version coldsnap)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the coldsnap version declared in versions.yaml ($declared)"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."

  build-coldsnap:
    name: Build coldsnap (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [ test-coldsnap, test-coldsnap-criu-rpc, verify-tag ]
    strategy:
      # One unsupported target must not withhold the assets for every other
      # platform; the release job needs what did build.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache-dependency-path: ./go.sum

      - name: Build
        working-directory: .
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # A dispatch run has no tag to read a version from, and must still
          # produce something identifiable rather than an asset called "".
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          COMMIT="$GITHUB_SHA"
          bin="coldsnap"
          if [ "$GOOS" = windows ]; then bin="$bin.exe"; fi
          stage="$RUNNER_TEMP/stage-coldsnap"
          rm -rf "$stage"
          mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w -buildid= -X github.com/sparksq/coldsnap/internal/buildinfo.Version=$VERSION -X github.com/sparksq/coldsnap/internal/buildinfo.Commit=$COMMIT" -o "$stage/$bin" ./cmd/coldsnap
          cp "$GITHUB_WORKSPACE/LICENSE" "$stage/"
          cp "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" "$stage/"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          base="coldsnap_${VERSION}_${GOOS}_${GOARCH}"
          case "$GOOS" in
            windows) (cd "$stage" && zip -qr "$dist/$base.zip" .) ;;
            *) tar -czf "$dist/$base.tar.gz" -C "$stage" . ;;
          esac
          ls -l "$dist"

      - name: Upload coldsnap (${{ matrix.goos }}/${{ matrix.goarch }})
        uses: actions/upload-artifact@v7
        with:
          name: binaries-coldsnap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          # An empty upload here would surface as a release that is simply
          # missing a platform, which nobody notices until someone downloads it.
          if-no-files-found: error

