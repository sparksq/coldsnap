# This release-specific workflow is intentionally maintained in this repository.
# It is outside the generic scitrera-repo-tools workflow generator. Automatic
# tag publication is disabled; use the explicit dispatch after configuring
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN for an intentional payload release.
name: Publish NCCL payloads

on:
  workflow_dispatch:
    inputs:
      release:
        description: "NCCL release directory, or all"
        required: true
        default: "all"

permissions:
  contents: read

concurrency:
  group: publish-nccl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select changed NCCL payloads
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      release_matrix: ${{ steps.plan.outputs.release_matrix }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan immutable payload publications
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python3 scripts/nccl-payload-release-plan.py \
              --release "${{ inputs.release }}" \
              --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "${previous_tag}" ]; then
            python3 scripts/nccl-payload-release-plan.py \
              --release all \
              --github-output "${GITHUB_OUTPUT}"
          else
            python3 scripts/nccl-payload-release-plan.py \
              --base-ref "${previous_tag}" \
              --head-ref "${GITHUB_SHA}" \
              --github-output "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.release }} (${{ matrix.platform }})
    if: needs.plan.outputs.has_changes == 'true'
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login docker.io \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

      - name: Enforce immutable provider tag
        shell: bash
        env:
          VERSIONED_IMAGE: ${{ matrix.repository }}:${{ matrix.provider_tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${VERSIONED_IMAGE}" >/dev/null 2>&1; then
            echo "::error::${VERSIONED_IMAGE} already exists; bump provider_revision instead of overwriting it"
            exit 1
          fi

      - name: Fetch locked NCCL source
        id: source
        shell: bash
        env:
          SOURCE_ARCHIVE: ${{ matrix.source_archive }}
          SOURCE_ARCHIVE_SHA256: ${{ matrix.source_archive_sha256 }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/nccl-source.tar.gz"
          source_root="${RUNNER_TEMP}/nccl-source"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${archive}" "${SOURCE_ARCHIVE}"
          printf '%s  %s\n' "${SOURCE_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${source_root}"
          tar -xzf "${archive}" --strip-components=1 --directory "${source_root}"
          printf 'root=%s\n' "${source_root}" >> "${GITHUB_OUTPUT}"

      - name: Create BuildKit builder
        shell: bash
        run: docker buildx create --driver docker-container --use

      - name: Build and push platform payload by digest
        id: build
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          COLDSNAP_NCCL_PROVIDER_ID: ${{ matrix.provider_id }}
          NCCL_BUILD_IMAGE: ${{ matrix.payload_build_image }}
          NCCL_LIBRARY_RELEASE: ${{ matrix.nccl_library_release }}
          NCCL_NVCC_GENCODE: ${{ matrix.nvcc_gencode }}
          NCCL_REPRODUCIBLE_NVCC: ${{ matrix.reproducible_nvcc }}
          NCCL_STRIP_OUTPUTS: ${{ matrix.strip_outputs }}
          NCCL_VERSION_CODE: ${{ matrix.nccl_version_code }}
          PAYLOAD_DOCKERFILE: ${{ matrix.payload_dockerfile }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE: ${{ matrix.release }}
          REPOSITORY: ${{ matrix.repository }}
          SOURCE_ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/build-metadata.json"
          docker buildx build \
            --platform "${PLATFORM}" \
            --file "${PAYLOAD_DOCKERFILE}" \
            --target provider_payload_oci \
            --build-context "nccl_source=${SOURCE_ROOT}" \
            --build-context "nccl_release=native/nccl/releases/${RELEASE}" \
            --build-arg "NCCL_BUILD_IMAGE=${NCCL_BUILD_IMAGE}" \
            --build-arg "NCCL_BUILD_JOBS=$(nproc)" \
            --build-arg "NCCL_LIBRARY_RELEASE=${NCCL_LIBRARY_RELEASE}" \
            --build-arg "NCCL_VERSION_CODE=${NCCL_VERSION_CODE}" \
            --build-arg "NCCL_NVCC_GENCODE=${NCCL_NVCC_GENCODE}" \
            --build-arg "NCCL_REPRODUCIBLE_NVCC=${NCCL_REPRODUCIBLE_NVCC}" \
            --build-arg "NCCL_STRIP_OUTPUTS=${NCCL_STRIP_OUTPUTS}" \
            --build-arg "COLDSNAP_NCCL_PROVIDER_ID=${COLDSNAP_NCCL_PROVIDER_ID}" \
            --build-arg "COLDSNAP_SOURCE_REVISION=${GITHUB_SHA}" \
            --cache-from "type=gha,scope=nccl-${RELEASE}-${ARCH}" \
            --cache-to "type=gha,mode=min,scope=nccl-${RELEASE}-${ARCH}" \
            --provenance=false \
            --output "type=image,name=${REPOSITORY},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${metadata}" \
            .
          digest="$(jq --raw-output '."containerimage.digest"' "${metadata}")"
          case "${digest}" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "invalid image digest: ${digest}" >&2; exit 2 ;; esac
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v7
        with:
          name: nccl-digest-${{ matrix.release_key }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-index:
    name: Publish ${{ matrix.provider_tag }} OCI index
    if: needs.plan.outputs.has_changes == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.release_matrix) }}
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v8
        with:
          pattern: nccl-digest-${{ matrix.release_key }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login docker.io \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

      - name: Publish versioned index and release alias
        shell: bash
        env:
          RELEASE_ALIAS: ${{ matrix.repository }}:${{ matrix.release_alias }}
          REPOSITORY: ${{ matrix.repository }}
          VERSIONED_IMAGE: ${{ matrix.repository }}:${{ matrix.provider_tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${VERSIONED_IMAGE}" >/dev/null 2>&1; then
            echo "::error::${VERSIONED_IMAGE} appeared during this run; refusing to overwrite it"
            exit 1
          fi
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "expected two platform digests, found ${#digest_files[@]}" >&2
            exit 2
          fi
          sources=()
          for digest in "${digest_files[@]}"; do
            case "${digest}" in ????????????????????????????????????????????????????????????????) ;; *) echo "invalid digest: ${digest}" >&2; exit 2 ;; esac
            sources+=("${REPOSITORY}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${VERSIONED_IMAGE}" \
            --tag "${RELEASE_ALIAS}" \
            "${sources[@]}"
          manifest="$(docker buildx imagetools inspect "${VERSIONED_IMAGE}" --raw)"
          jq --exit-status '
            [.manifests[].platform | (.os + "/" + .architecture)] | sort
            == ["linux/amd64", "linux/arm64"]
          ' <<<"${manifest}" >/dev/null
          docker buildx imagetools inspect "${VERSIONED_IMAGE}"
