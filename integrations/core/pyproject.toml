[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldsnap-core"
version = "0.3.22"
description = "Engine-neutral ColdSnap artifact and GPU-memory contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["coldsnap_core"]
