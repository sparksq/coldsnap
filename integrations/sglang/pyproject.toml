[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldsnap-sglang"
version = "0.3.4"
description = "ColdSnap artifact and live-memory integration for SGLang"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["coldsnap-core==0.3.23"]

[project.entry-points."sglang.srt.plugins"]
coldsnap = "coldsnap_sglang:register"

[tool.setuptools]
packages = ["coldsnap_sglang"]
