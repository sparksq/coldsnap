[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldsnap-development"
version = "0.3.21"
description = "ColdSnap source workspace; not a published runtime distribution"
requires-python = ">=3.10"
license = "AGPL-3.0-only"

[tool.setuptools]
packages = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "integrations/core",
  "integrations/sglang",
  "integrations/vllm",
]

[tool.uv.sources]
coldsnap-core = { workspace = true }
