version = 1
revision = 3
requires-python = ">=3.10"

[manifest]
members = [
    "coldsnap-core",
    "coldsnap-development",
    "coldsnap-sglang",
    "coldsnap-vllm",
]

[[package]]
name = "coldsnap-core"
version = "0.3.28"
source = { editable = "integrations/core" }

[[package]]
name = "coldsnap-development"
version = "0.3.28"
source = { virtual = "." }

[[package]]
name = "coldsnap-sglang"
version = "0.3.4"
source = { editable = "integrations/sglang" }
dependencies = [
    { name = "coldsnap-core" },
]

[package.metadata]
requires-dist = [{ name = "coldsnap-core", editable = "integrations/core" }]

[[package]]
name = "coldsnap-vllm"
version = "0.5.11"
source = { editable = "integrations/vllm" }
dependencies = [
    { name = "coldsnap-core" },
]

[package.metadata]
requires-dist = [{ name = "coldsnap-core", editable = "integrations/core" }]
